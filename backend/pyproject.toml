[project]
name = "weather-data-exporter-backend"
version = "0.1.0"
description = "Backend proxy for Meteostat bulk endpoints (CORS + decompression + filtering)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.json"]
